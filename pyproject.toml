[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnelscope-ipsec-analyzer"
version = "0.2.0"
description = "Local-first IPsec/IKE packet capture and VPN configuration review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "scapy==2.8.0",
  "pandas==2.2.3",
  "streamlit==1.65.0",
  "plotly==7.0.0",
  "pydantic==2.14.0",
  "typer==0.27.3",
]

[project.optional-dependencies]
reports = ["reportlab>=4.0"]
dev = ["ruff>=0.9.0", "bandit>=1.8.0", "pip-audit>=2.7.0", "pytest==8.4.2"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/app.py" = ["E402"]
